<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Define o conjunto de caracteres -->
  <meta charset="UTF-8">

  <!-- Título da página -->
  <title>Loja Espricio</title>

  <!-- Importa o CSS do Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<!-- Fundo claro -->
<body class="bg-light">

  <!-- Container principal -->
  <main class="container mt-5">

    <!-- Título da loja -->
    <h1 id="tituloLoja" class="text-center mb-4">
      🛒 Loja Espricio
    </h1>

    <!-- Card do produto -->
    <div class="card">
      <div class="card-body">

        <!-- Nome do produto -->
        <h5 id="nomeProduto" class="card-title">
          Camiseta Espricio
        </h5>

        <!-- Preço do produto -->
        <p id="precoProduto" class="card-text">
          Preço: R$ 59.90
        </p>

        <!-- Estoque disponível -->
        <p id="estoqueProduto">
          Estoque: 10 unidades
        </p>

        <!-- Botão de compra -->
        <button id="btnComprar" class="btn btn-success" onclick="comprarProduto()">
          Comprar
        </button>

        <!-- Botão para resetar o estoque -->
        <button id="btnReset" class="btn btn-secondary ms-2" onclick="resetarProduto()">
          Resetar
        </button>

        <hr>

        <!-- Mensagem de feedback -->
        <p id="mensagem" class="fw-bold"></p>

      </div>
    </div>
  </main>

  <!-- Script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
