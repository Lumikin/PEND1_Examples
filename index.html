<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header class="conteiner mt-3">
      <h2 class="display-5">🔒</h2>
    </header>
    <main class="conteiner mt-4">
      <form id="formLogin" class="my-2">
        <div class="row">
          <label for="username" class="col-sm-2 col-form-label"></label>
          <div class="col-sm-10">
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Usuario"
              required
            />
          </div>
        </div>

        <div class="row">
          <label for="password" class="col-sm-2 col-form-label"></label>
          <div class="col-sm-10">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="senha"
              required
            />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-12">
            <button type="submit" class="btn btn-outline-secondary w-100">
              logar
            </button>
          </div>
        </div>
        <div id="msgErro" class="alert alert-danger d-none">
          Usuario ou senha invalidos
        </div>
        <div id="msgLogado" class="alert alert-success d-none">
          Usuario ou senha invalidos
        </div>
      </form>
    </main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="./script.js"></script>
  </body>
</html>
